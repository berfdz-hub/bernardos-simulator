function parseCombo(raw) {
  const p = raw.split(",");
  return { m79:p[0], m85:p[1], m81:p[2], m74:p[3], m82:p[4], m77:p[5], m87:p[6], m80:p[7] };
}

function rankToStr(rank) {
  return Math.max(20, Math.round(99 - (rank - 1) * 0.62));
}
const BASE_STR = {};
Object.entries(FIFA_RANK).forEach(([t,r]) => { BASE_STR[t] = rankToStr(r); });

// ─── SIMULATION ENGINE ───────────────────────────────────────
function getStrength(team, liveStrengths) {
  const base = BASE_STR[team] || 45;
  if (!liveStrengths || !liveStrengths[team]) return base;
  const form = liveStrengths[team].form_score || 0;
  return Math.max(10, Math.min(99, base + form));
}

function simScore(tA, tB, variance, liveStrengths) {
  const sa = getStrength(tA, liveStrengths), sb = getStrength(tB, liveStrengths);
  const diff = sa - sb;
  const noise = () => (Math.random()+Math.random()+Math.random()-1.5) * variance * 0.07;
  const ag = Math.max(0, Math.round(1.2 + diff*0.035 + noise()));
  const bg = Math.max(0, Math.round(1.2 - diff*0.035 + noise()));
  return [ag, bg];
}

function simKO(tA, tB, variance, bias, liveStrengths) {
  if (!tA || !tB || tA === tB) return { a:tA||"TBD", b:tB||"TBD", sa:0, sb:0, w:tA||tB };
  let [sa, sb] = simScore(tA, tB, variance, liveStrengths);
  if (sa === sb) {
    const strA = getStrength(tA, liveStrengths), strB = getStrength(tB, liveStrengths);
    const pA = bias*(strA)/((strA)+(strB)) + (1-bias)*0.5;
    if (Math.random() < pA) sa++; else sb++;
  }
  return { a:tA, b:tB, sa, sb, w:sa>sb?tA:tB };
}

function simGroup(teams, variance, bias, lockedResults, liveStrengths) {
  const pts={}, gf={}, ga={}, wins={}, draws={}, losses={};
  teams.forEach(t => { pts[t]=0; gf[t]=0; ga[t]=0; wins[t]=0; draws[t]=0; losses[t]=0; });
  const matches = [];

  for (let i=0; i<teams.length; i++) {
    for (let j=i+1; j<teams.length; j++) {
      const ta=teams[i], tb=teams[j];
      let sa, sb, isLocked = false;

      // Check if this match has a locked real result
      const lockKey = `${ta}|${tb}`;
      const lockKeyRev = `${tb}|${ta}`;
      if (lockedResults && lockedResults[lockKey]) {
        sa = lockedResults[lockKey].home; sb = lockedResults[lockKey].away;
        isLocked = true;
      } else if (lockedResults && lockedResults[lockKeyRev]) {
        sb = lockedResults[lockKeyRev].home; sa = lockedResults[lockKeyRev].away;
        isLocked = true;
      } else {
        [sa, sb] = simScore(ta, tb, variance, liveStrengths);
      }

      gf[ta]+=sa; ga[ta]+=sb; gf[tb]+=sb; ga[tb]+=sa;
      if (sa>sb)      { pts[ta]+=3; wins[ta]++; losses[tb]++; }
      else if (sb>sa) { pts[tb]+=3; wins[tb]++; losses[ta]++; }
      else            { pts[ta]++; pts[tb]++; draws[ta]++; draws[tb]++; }
      matches.push({ a:ta, b:tb, sa, sb, locked:isLocked });
    }
  }

  const gd = t => gf[t]-ga[t];
  const sorted = [...teams].sort((tx,ty) =>
    (pts[ty]-pts[tx]) || (gd(ty)-gd(tx)) || (gf[ty]-gf[tx]) ||
    ((getStrength(ty,liveStrengths))-(getStrength(tx,liveStrengths)))
  );
  return { p1:sorted[0], p2:sorted[1], p3:sorted[2], p4:sorted[3], pts, gf, ga, wins, draws, losses, matches };
}

  const { variance, bias } = lv;

    (ty.pts-tx.pts)||(ty.gd-tx.gd)||(ty.gf-tx.gf)||

  const best8 = allThirds.slice(0,8);

  const W = {}; r32.forEach(m => { W[m.id]=m.w; });

    mk("M89",W.M73,W.M75), mk("M90",W.M74,W.M77), mk("M91",W.M76,W.M78), mk("M92",W.M79,W.M80),
    mk("M93",W.M81,W.M82), mk("M94",W.M83,W.M84), mk("M95",W.M86,W.M88), mk("M96",W.M85,W.M87),

    mk("M97",W.M89,W.M90), mk("M98",W.M91,W.M92), mk("M99",W.M93,W.M94), mk("M100",W.M95,W.M96),

  sf.forEach(m => { W[m.id]=m.w; });

  const sf2l = sf[1].a===sf[1].w ? sf[1].b : sf[1].a;
  const bronze = mk("M103",sf1l,sf2l);
  const final  = mk("M104",W.M101,W.M102);

  const CIRCLED = new Set(["M79","M84","M92","M95","M97","M102","M104"]);
  return { gr, best8, r32, r16, qf, sf, bronze, final, CIRCLED };
}

// ─── BRACKET LAYOUT ──────────────────────────────────────────
const CW=180, CH=72, CG=6, COL=26, HDR=20;
function slotY(roundIdx, slotIdx) {
  const unit = CH + CG;
  const spacing = unit * Math.pow(2, roundIdx);
  const firstTop = HDR + spacing/2 - CH/2;
  return firstTop + slotIdx * spacing + CH/2;
}
const BH = HDR + (CH+CG)*8 + 20;

const fl = t => FLAGS[t]||"🏳️";

// ─── BRACKET CARD ─────────────────────────────────────────────
function BCard({ m, circled, C }) {
  if (!m) return <div style={{width:CW,height:CH,background:C.surface,borderRadius:7,border:`1px solid ${C.border}`}}/>;
  const aw=m.w===m.a, bw=m.w===m.b;
  return (
    <div style={{
      width:CW, background:circled?C.cardGold:C.card,
      border:`1.5px solid ${circled?C.gold:C.border}`, borderRadius:7, padding:"5px 7px",
      boxShadow:circled?`0 0 14px ${C.gold}55`:"0 1px 3px #00000033",
      position:"relative", boxSizing:"border-box",
    }}>
      {circled && <div style={{position:"absolute",top:-6,right:4,fontSize:7,background:C.gold,color:"#000",borderRadius:3,padding:"1px 4px",fontWeight:"800"}}>🟣 TICKET</div>}
      <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:circled?C.gold:C.muted,marginBottom:3}}>
        <span style={{fontWeight:"700"}}>{m.id}</span>
        <span style={{maxWidth:84,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.venue}</span>
      </div>
      {[{t:m.a,s:m.sa,w:aw},{t:m.b,s:m.sb,w:bw}].map((row,i) => (
        <div key={i} style={{display:"flex",alignItems:"center",gap:3,padding:"2px 0"}}>
          <span style={{fontSize:13,lineHeight:1}}>{fl(row.t)}</span>
          <span style={{fontSize:7.5,color:C.muted,minWidth:19}}>#{FIFA_RANK[row.t]||"?"}</span>
          <span style={{fontSize:10,fontWeight:row.w?"700":"400",color:row.w?C.gold:C.text,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{row.t||"TBD"}</span>
          <span style={{fontSize:12,fontWeight:"900",color:row.w?C.gold:"#777",minWidth:14,textAlign:"right"}}>{row.s}</span>
        </div>
      ))}
    </div>
  );
}

function HalfBracket({ rounds, direction, circled, C }) {
  const ltr = direction === "ltr";
  const nC  = rounds.length;
  const W   = nC * (CW + COL) - COL;
  function cy(r, s) {
    const realRound = ltr ? r : (nC - 1 - r);
    return slotY(realRound, s);
  }
  const lines = [];
  if (ltr) {
    for (let r = 0; r < nC - 1; r++) {
      const nParent = rounds[r+1].length;
      for (let d = 0; d < nParent; d++) {
        const y1=cy(r,d*2), y2=cy(r,d*2+1), yP=cy(r+1,d), yM=(y1+y2)/2;
        const xSrc=r*(CW+COL)+CW, xDst=(r+1)*(CW+COL), xMid=xSrc+COL/2;
        lines.push(<g key={r+"-"+d}>
          <line x1={xSrc} y1={y1} x2={xMid} y2={y1} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xSrc} y1={y2} x2={xMid} y2={y2} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xMid} y1={y1} x2={xMid} y2={y2} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xMid} y1={yM} x2={xDst} y2={yM} stroke={C.accent} strokeWidth="1.5"/>
          {yM!==yP && <line x1={xDst} y1={yM} x2={xDst} y2={yP} stroke={C.accent} strokeWidth="1.5"/>}
        </g>);
      }
    }
  } else {
    for (let r = 0; r < nC - 1; r++) {
      const nParent = rounds[r].length;
      for (let d = 0; d < nParent; d++) {
        const y1=cy(r+1,d*2), y2=cy(r+1,d*2+1), yP=cy(r,d), yM=(y1+y2)/2;
        const xSrc=(r+1)*(CW+COL), xDst=r*(CW+COL)+CW, xMid=xSrc-COL/2;
        lines.push(<g key={r+"-"+d}>
          <line x1={xSrc} y1={y1} x2={xMid} y2={y1} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xSrc} y1={y2} x2={xMid} y2={y2} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xMid} y1={y1} x2={xMid} y2={y2} stroke={C.border} strokeWidth="1.5"/>
          <line x1={xMid} y1={yM} x2={xDst} y2={yM} stroke={C.accent} strokeWidth="1.5"/>
          {yM!==yP && <line x1={xDst} y1={yM} x2={xDst} y2={yP} stroke={C.accent} strokeWidth="1.5"/>}
        </g>);
      }
    }
  }
  const LBLS = ltr ? ["R32","R16","QF","SF"] : ["SF","QF","R16","R32"];
  return (
    <div style={{position:"relative",width:W,height:BH,flexShrink:0}}>
      <svg style={{position:"absolute",top:0,left:0,width:W,height:BH,pointerEvents:"none"}}>{lines}</svg>
      {rounds.map((_,r) => (
        <div key={r} style={{position:"absolute",top:0,left:r*(CW+COL),width:CW,
          textAlign:"center",fontSize:7,color:C.gold,fontWeight:"700",letterSpacing:1,
          borderBottom:`1px solid ${C.goldDim}`,paddingBottom:2}}>{LBLS[r]}</div>
      ))}
      {rounds.map((ms,r) => ms.map((m,s) => (
        <div key={m?.id||r+"-"+s} style={{position:"absolute",top:cy(r,s)-CH/2,left:r*(CW+COL)}}>
          <BCard m={m} circled={circled?.has(m?.id)} C={C}/>
        </div>
      )))}
    </div>
  );
}

function App() {

  const [tab, setTab]                 = useState("groups");
  const [grpPage, setGrpPage]         = useState(0);
  const [liveStrengths, setLiveStrengths] = useState(null);
  const [lockedResults, setLockedResults] = useState(null);
  const [liveStatus, setLiveStatus]   = useState("loading");
  const [lastUpdated, setLastUpdated] = useState(null);

  const C = darkMode ? DARK : LIGHT;

  // ── Load live data from Supabase ──────────────────────────
  useEffect(() => {
    async function loadLiveData() {
      setLiveStatus("loading");
      try {
        // Fetch team strengths (form scores)
        const teams = await supaFetch('teams?select=id,form_score,base_strength');
        // Fetch locked match results
        const locked = await supaFetch('matches?select=home_team,away_team,home_score,away_score,competition&locked=eq.true&competition=eq.WC2026');

        if (teams && teams.length > 0) {
          const strengthMap = {};
          teams.forEach(t => { strengthMap[t.id] = { form_score: t.form_score || 0 }; });
          setLiveStrengths(strengthMap);
        }

        if (locked && locked.length > 0) {
          const lockMap = {};
          locked.forEach(m => {
            const key = `${m.home_team}|${m.away_team}`;
            lockMap[key] = { home: m.home_score, away: m.away_score };
          });
          setLockedResults(lockMap);
        }

        setLiveStatus(teams && teams.length > 0 ? "live" : "cached");
        setLastUpdated(new Date().toLocaleTimeString());
      } catch {
        setLiveStatus("error");
      }
    }
    loadLiveData();
    // Refresh every 5 minutes
    const interval = setInterval(loadLiveData, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);

  // Apply dark/light to body
  useEffect(() => {
    document.body.className = darkMode ? "" : "light";
    document.body.style.background = C.bg;
  }, [darkMode]);

  const resim = useCallback(() => setSim(runSim(levelId, lockedResults, liveStrengths)), [levelId, lockedResults, liveStrengths]);

  useEffect(() => { setSim(runSim(levelId, lockedResults, liveStrengths)); }, [levelId, lockedResults, liveStrengths]);

  if (!sim) return (
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:C.gold,fontFamily:"Georgia",fontSize:18}}>
      <OlivosLogo size={40} color={C.gold}/> &nbsp; Loading…
    </div>
  );

  const TABS = [
    {id:"groups",label:"👥 Groups"},
    {id:"bracket",label:"🏟️ Bracket"},
    {id:"r32",label:"⚔️ R32"},
    {id:"r16",label:"🔵 R16"},
    {id:"qfsf",label:"🔥 QF/SF"},
    {id:"final",label:"🥇 Final"},
    {id:"circled",label:"🟣 My Games"},
  ];

  const circledList = [
    {label:"R32 · Los Angeles",      m:sim.r32.find(m=>m.id==="M84")},
    {label:"R32 · Mexico City",      m:sim.r32.find(m=>m.id==="M79")},
    {label:"R16 · Mexico City",      m:sim.r16.find(m=>m.id==="M92")},
    {label:"R16 · Atlanta",          m:sim.r16.find(m=>m.id==="M95")},
    {label:"QF · Boston",            m:sim.qf.find(m=>m.id==="M97")},
    {label:"SF · Atlanta",           m:sim.sf.find(m=>m.id==="M102")},
    {label:"🏆 Final · East Rutherford NJ", m:sim.final},
  ];

  const curLevel = LEVELS.find(l => l.id===levelId);

  return (
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"Georgia,serif",paddingBottom:40,
      // Subtle Olivos watermark
      backgroundImage:`radial-gradient(ellipse at 50% 100%, ${C.gold}08 0%, transparent 60%)`,
    }}>

      {/* ── HEADER ── */}
      <div style={{background:C.headerBg,borderBottom:`2px solid ${C.gold}`,padding:"12px 14px"}}>

        {/* Top row: Logo + title + controls */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          {/* Left: Logo + branding */}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <OlivosLogo size={44} color={C.gold}/>
            <div>
              <div style={{fontSize:8,letterSpacing:5,color:C.gold,fontWeight:"700"}}>OLIVOS</div>
              <div style={{fontSize:20,fontWeight:"900",color:C.text,letterSpacing:1}}>PREDICTOR</div>
              <div style={{fontSize:8,color:C.muted,letterSpacing:2}}>WORLD CUP 2026 · SIMULATOR</div>
            </div>
          </div>

          {/* Right: Champion + controls */}
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <LiveBadge liveStatus={liveStatus} C={C}/>
              {/* Dark/Light toggle */}
              <button onClick={()=>setDarkMode(d=>!d)} style={{
                padding:"4px 10px",borderRadius:16,border:`1px solid ${C.border}`,
                background:"transparent",color:C.muted,fontSize:11,cursor:"pointer",
              }}>
                {darkMode ? "☀️ Light" : "🌙 Dark"}
              </button>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:8,color:C.muted,letterSpacing:2}}>PREDICTED CHAMPION</div>
              <div style={{fontSize:17,fontWeight:"700",color:C.gold}}>{fl(sim.final.w)} {sim.final.w}</div>
              <div style={{fontSize:8.5,color:C.muted}}>Rank #{FIFA_RANK[sim.final.w]} · Final {sim.final.sa}–{sim.final.sb} · NJ</div>
            </div>
          </div>
        </div>

        {/* Level selector */}
        <div style={{marginTop:10}}>
          <div style={{fontSize:8,color:C.muted,letterSpacing:2,marginBottom:6}}>SIMULATION LEVEL</div>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {LEVELS.map(lv => (
              <button key={lv.id} onClick={()=>setLevelId(lv.id)} style={{
                padding:"4px 8px",borderRadius:7,cursor:"pointer",fontSize:10,fontFamily:"Georgia",
                background:levelId===lv.id?`${LEVEL_COLORS[lv.id]}22`:"transparent",
                color:levelId===lv.id?LEVEL_COLORS[lv.id]:C.muted,
                border:`1.5px solid ${levelId===lv.id?LEVEL_COLORS[lv.id]:C.border}`,
                fontWeight:levelId===lv.id?"700":"400",
              }}>{lv.label}</button>
            ))}
          </div>
          {curLevel && <div style={{marginTop:5,fontSize:8.5,color:LEVEL_COLORS[levelId],fontStyle:"italic"}}>{curLevel.desc}</div>}
        </div>

        {/* Action buttons */}
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
          <button onClick={resim} style={{padding:"4px 14px",background:"transparent",border:`1px solid ${C.gold}`,color:C.gold,borderRadius:20,cursor:"pointer",fontSize:10,letterSpacing:1,fontFamily:"Georgia"}}>
            🔄 Resimulate
          </button>
          <ShareButton sim={sim} C={C}/>
          {lastUpdated && <span style={{fontSize:8,color:C.muted}}>Data updated: {lastUpdated}</span>}
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{display:"flex",overflowX:"auto",borderBottom:`1px solid ${C.border}`,background:C.surface}}>
        {TABS.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:"9px 12px",whiteSpace:"nowrap",background:"none",border:"none",
            color:tab===t.id?C.gold:C.muted,fontFamily:"Georgia",fontSize:11,
            borderBottom:tab===t.id?`2px solid ${C.gold}`:"2px solid transparent",
            cursor:"pointer",fontWeight:tab===t.id?"700":"400",
          }}>{t.label}</button>
        ))}
      </div>

      <div style={{padding:"12px 14px"}}>

        {/* ── GROUPS ── */}
        {tab==="groups" && (
          <div>
            <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap",alignItems:"center"}}>
              {["A-F","G-L"].map((l,i)=>(
                <button key={i} onClick={()=>setGrpPage(i)} style={{padding:"4px 14px",borderRadius:16,border:`1px solid ${grpPage===i?C.gold:C.border}`,background:grpPage===i?C.gold+"11":"transparent",color:grpPage===i?C.gold:C.muted,cursor:"pointer",fontSize:10,fontFamily:"Georgia"}}>
                  Groups {l}
                </button>
              ))}
              <span style={{fontSize:8.5,color:C.muted,flex:1}}>
                Best 3rd: {sim.best8.map(x=>`${x.team.split(" ")[0]}(G${x.group})`).join(", ")}
              </span>
            </div>
            {Object.entries(sim.gr)
              .filter(([g])=>grpPage===0?"ABCDEF".includes(g):"GHIJKL".includes(g))
              .map(([g,data])=><GroupTable key={g} grp={g} data={data} C={C}/>)}
          </div>
        )}

        {tab==="bracket" && <VisualBracket sim={sim} C={C}/>}

        {tab==="r32" && (
          <div>
            <div style={{fontSize:8.5,color:C.muted,marginBottom:10,letterSpacing:1}}>16 MATCHES · JUNE 28 – JULY 3</div>
            <MatchGrid matches={sim.r32} circled={sim.CIRCLED} C={C}/>
          </div>
        )}

        {tab==="r16" && (
          <div>
            <div style={{fontSize:8.5,color:C.muted,marginBottom:10,letterSpacing:1}}>8 MATCHES · JULY 4–7</div>
            <MatchGrid matches={sim.r16} circled={sim.CIRCLED} C={C}/>
          </div>
        )}

        {tab==="qfsf" && (
          <div>
            <div style={{fontSize:8.5,color:C.gold,letterSpacing:2,marginBottom:8,fontWeight:"700"}}>QUARTER-FINALS · JULY 9–10</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              {sim.qf.map((m,i)=><KOCard key={i} m={m} circled={sim.CIRCLED.has(m.id)} C={C}/>)}
            </div>
            <div style={{fontSize:8.5,color:C.gold,letterSpacing:2,marginBottom:8,fontWeight:"700"}}>SEMI-FINALS · JULY 13–15</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {sim.sf.map((m,i)=><KOCard key={i} m={m} circled={sim.CIRCLED.has(m.id)} C={C}/>)}
            </div>
          </div>
        )}

        {tab==="final" && (
          <div>
            <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"11px",marginBottom:12}}>
              <div style={{fontSize:8.5,color:C.muted,letterSpacing:2,marginBottom:7}}>🥉 THIRD PLACE · {sim.bronze.venue} · July 18</div>
              <KOCard m={sim.bronze} circled={false} C={C}/>
            </div>
            <div style={{background:C.cardGold,border:`2px solid ${C.gold}`,borderRadius:16,padding:"16px",boxShadow:`0 0 40px ${C.gold}44`,position:"relative",overflow:"hidden"}}>
              <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at 50% 0%,${C.gold}18,transparent 70%)`,pointerEvents:"none"}}/>
              <div style={{textAlign:"center",marginBottom:14}}>
                <div style={{fontSize:9,color:C.gold,letterSpacing:5,fontWeight:"700"}}>🏆 THE FINAL</div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>M104 · East Rutherford Stadium, NJ · July 19 2026</div>
              </div>
              <div style={{display:"flex",justifyContent:"space-around",alignItems:"center"}}>
                {[{t:sim.final.a,s:sim.final.sa},{t:sim.final.b,s:sim.final.sb}].map((side,i)=>{
                  const isW=sim.final.w===side.t;
                  return (
                    <div key={i} style={{textAlign:"center",flex:1}}>
                      <div style={{fontSize:48}}>{fl(side.t)}</div>
                      <div style={{fontSize:9,color:C.muted}}>Rank #{FIFA_RANK[side.t]||"?"}</div>
                      <div style={{fontSize:13,fontWeight:"700",color:isW?C.gold:C.muted,marginTop:2}}>{side.t}</div>
                      <div style={{fontSize:28,fontWeight:"900",color:isW?C.gold:C.muted,marginTop:4}}>{side.s}</div>
                      {isW && <div style={{fontSize:9,color:C.gold,marginTop:3,letterSpacing:1}}>🏆 CHAMPION</div>}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:14,textAlign:"center",padding:"8px",background:C.gold+"18",borderRadius:10,border:`1px solid ${C.goldDim}`}}>
                <div style={{fontSize:26}}>{fl(sim.final.w)}</div>
                <div style={{fontSize:15,fontWeight:"900",color:C.gold}}>{sim.final.w}</div>
                <div style={{fontSize:8.5,color:C.muted,letterSpacing:2}}>WORLD CUP 2026 CHAMPION</div>
              </div>
            </div>
          </div>
        )}

        {tab==="circled" && (
          <div>
            <div style={{fontSize:8.5,color:C.muted,textAlign:"center",marginBottom:12,letterSpacing:1}}>YOUR 7 PURPLE-CIRCLED GAMES FROM THE SCHEDULE</div>
            {circledList.map(({label,m},i)=>{
              const isFinal=m?.id==="M104";
              return (
                <div key={i} style={{
                  background:isFinal?C.cardGold:C.card,
                  border:`2px solid ${isFinal?C.gold:C.border}`,borderRadius:12,padding:"11px 13px",marginBottom:9,
                  boxShadow:isFinal?`0 0 20px ${C.gold}44`:"none",
                }}>
                  <div style={{fontSize:8.5,color:isFinal?C.gold:C.accent,fontWeight:"700",letterSpacing:2,marginBottom:7}}>
                    {isFinal?"🏆":"🟣"} {label}
                  </div>
                  {[{t:m?.a,s:m?.sa,w:m?.w===m?.a},{t:m?.b,s:m?.sb,w:m?.w===m?.b}].map((row,j)=>(
                    <div key={j} style={{display:"flex",alignItems:"center",gap:7,marginBottom:j===0?5:0}}>
                      <span style={{fontSize:22}}>{fl(row.t)}</span>
                      <span style={{fontSize:8.5,color:C.muted}}>#{FIFA_RANK[row.t]||"?"}</span>
                      <span style={{fontSize:13,fontWeight:row.w?"700":"400",color:row.w?C.gold:C.text,flex:1}}>{row.t||"TBD"}</span>
                      <span style={{fontSize:18,fontWeight:"900",color:row.w?C.gold:"#888"}}>{row.s??"-"}</span>
                    </div>
                  ))}
                  <div style={{marginTop:7,padding:"4px 9px",background:isFinal?C.gold+"18":C.green+"18",borderRadius:7,fontSize:10,color:isFinal?C.gold:C.green,fontWeight:"700"}}>
                    {isFinal?"🏆":"✓"} Winner: {fl(m?.w)} {m?.w}
                  </div>
                  <div style={{marginTop:3,fontSize:8,color:C.muted}}>Match {m?.id} · {m?.venue}</div>
                </div>
              );
            })}
          </div>
        )}

      </div>

      {/* ── FOOTER ── */}
      <div style={{marginTop:36,padding:"12px 14px",borderTop:`1px solid ${C.border}`,
        display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
        <OlivosLogo size={18} color={C.goldDim}/>
        <span style={{fontSize:9,color:C.border,letterSpacing:2}}>OLIVOS PREDICTOR · WC2026 · SIMULATION ONLY</span>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
