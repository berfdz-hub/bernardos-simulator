// ─── CONFETTI ─────────────────────────────────────────────────
let confettiFired=false;
function fireConfetti(){
  if(confettiFired)return;
  confettiFired=true;
  const layer=document.getElementById('confetti-layer');
  if(!layer)return;
  const dogs=['./images/chip-campeon.png','./images/chip-emocion.png'];
  const N=28;
  for(let i=0;i<N;i++){
    setTimeout(()=>{
      const img=document.createElement('img');
      img.className='dog-confetti';
      img.src=dogs[i%2];
      img.style.left=Math.random()*95+'vw';
      img.style.top='-80px';
      img.style.width=(44+Math.random()*32)+'px';
      img.style.height='auto';
      const dur=1.8+Math.random()*2.2;
      const anim=Math.random()>0.5?'dogFall':'dogBounce';
      img.style.animation=`${anim} ${dur}s ease-in forwards`;
      layer.appendChild(img);
      setTimeout(()=>img.remove(),(dur+0.3)*1000);
    },i*120);
  }
  setTimeout(()=>{confettiFired=false;},8000);
}

// ─── SIM ENGINE ───────────────────────────────────────────────
function getStr(t,ls){const b=BASE_STR[t]||45;if(!ls||!ls[t])return b;return Math.max(10,Math.min(99,b+(ls[t].form_score||0)));}
function simScore(tA,tB,v,ls){
  const sa=getStr(tA,ls),sb=getStr(tB,ls),diff=sa-sb;
  const n=()=>(Math.random()+Math.random()+Math.random()-1.5)*v*0.07;
  return[Math.max(0,Math.round(1.2+diff*0.035+n())),Math.max(0,Math.round(1.2-diff*0.035+n()))];
}
function simKO(tA,tB,v,bias,ls){
  if(!tA||!tB||tA===tB)return{a:tA||"TBD",b:tB||"TBD",sa:0,sb:0,w:tA||tB};
  let[sa,sb]=simScore(tA,tB,v,ls);
  if(sa===sb){const sA=getStr(tA,ls),sB=getStr(tB,ls),p=bias*(sA/(sA+sB))+(1-bias)*0.5;if(Math.random()<p)sa++;else sb++;}
  return{a:tA,b:tB,sa,sb,w:sa>sb?tA:tB};
}
function simGroup(teams,v,bias,locked,ls,whatif){
  const pts={},gf={},ga={},wins={},draws={},losses={};
  teams.forEach(t=>{pts[t]=0;gf[t]=0;ga[t]=0;wins[t]=0;draws[t]=0;losses[t]=0;});
  const matches=[];
  for(let i=0;i<teams.length;i++){
    for(let j=i+1;j<teams.length;j++){
      const ta=teams[i],tb=teams[j];
      let sa,sb,isLocked=false,isWhatif=false;
      const k=`${ta}|${tb}`,kr=`${tb}|${ta}`;
      if(locked&&locked[k]){sa=locked[k].home;sb=locked[k].away;isLocked=true;}
      else if(locked&&locked[kr]){sb=locked[kr].home;sa=locked[kr].away;isLocked=true;}
      else if(whatif&&whatif[k]){sa=whatif[k].home;sb=whatif[k].away;isWhatif=true;}
      else if(whatif&&whatif[kr]){sb=whatif[kr].home;sa=whatif[kr].away;isWhatif=true;}
      else{[sa,sb]=simScore(ta,tb,v,ls);}
      gf[ta]+=sa;ga[ta]+=sb;gf[tb]+=sb;ga[tb]+=sa;
      if(sa>sb){pts[ta]+=3;wins[ta]++;losses[tb]++;}
      else if(sb>sa){pts[tb]+=3;wins[tb]++;losses[ta]++;}
      else{pts[ta]++;pts[tb]++;draws[ta]++;draws[tb]++;}
      matches.push({a:ta,b:tb,sa,sb,locked:isLocked,whatif:isWhatif});
    }
  }
  const gd=t=>gf[t]-ga[t];
  const sorted=[...teams].sort((tx,ty)=>(pts[ty]-pts[tx])||(gd(ty)-gd(tx))||(gf[ty]-gf[tx])||((getStr(ty,ls))-(getStr(tx,ls))));
  return{p1:sorted[0],p2:sorted[1],p3:sorted[2],p4:sorted[3],pts,gf,ga,wins,draws,losses,matches};
}
function runSim(levelId,locked,ls,whatif){
  const lv=LEVELS.find(l=>l.id===levelId)||LEVELS[2];
  const{variance:v,bias}=lv;
  const gr={};
  Object.entries(GROUPS).forEach(([g,teams])=>{gr[g]=simGroup(teams,v,bias,locked,ls,whatif);});
  const allT=Object.entries(gr).map(([g,r])=>({group:g,team:r.p3,pts:r.pts[r.p3],gd:r.gf[r.p3]-r.ga[r.p3],gf:r.gf[r.p3]}))
    .sort((tx,ty)=>(ty.pts-tx.pts)||(ty.gd-tx.gd)||(ty.gf-tx.gf)||((getStr(ty.team,ls))-(getStr(tx.team,ls))));
  const best8=allT.slice(0,8);
  const t3={};best8.forEach(x=>{t3[x.group]=x.team;});
  const key=[...best8.map(x=>x.group)].sort().join("");
  const combo=COMBOS[key]?parseCombo(COMBOS[key]):null;
  const used=new Set();
  const s3=g=>{const t=t3[g];if(t&&!used.has(t)){used.add(t);return t;}for(const x of best8){if(!used.has(x.team)){used.add(x.team);return x.team;}}return"TBD";};
  const s3f=pool=>{for(const g of pool.split("")){const t=t3[g];if(t&&!used.has(t)){used.add(t);return t;}}for(const x of best8){if(!used.has(x.team)){used.add(x.team);return x.team;}}return"TBD";};
  const opp=combo
    ?{m74:s3(combo.m74),m77:s3(combo.m77),m79:s3(combo.m79),m80:s3(combo.m80),m81:s3(combo.m81),m82:s3(combo.m82),m85:s3(combo.m85),m87:s3(combo.m87)}
    :{m74:s3f("ABCDF"),m77:s3f("CDFGH"),m79:s3f("CEFHI"),m80:s3f("EHIJK"),m81:s3f("BEFIJ"),m82:s3f("AEHIJ"),m85:s3f("EFGIJ"),m87:s3f("DEIJL")};
  const mk=(id,tA,tB)=>({...simKO(tA,tB,v,bias,ls),id,venue:KO_VENUES[id]||""});
  const r32=[
    mk("M73",gr.A.p2,gr.B.p2),mk("M74",gr.E.p1,opp.m74),mk("M75",gr.F.p1,gr.C.p2),mk("M76",gr.C.p1,gr.F.p2),
    mk("M77",gr.I.p1,opp.m77),mk("M78",gr.E.p2,gr.I.p2),mk("M79",gr.A.p1,opp.m79),mk("M80",gr.L.p1,opp.m80),
    mk("M81",gr.D.p1,opp.m81),mk("M82",gr.G.p1,opp.m82),mk("M83",gr.K.p2,gr.L.p2),mk("M84",gr.H.p1,gr.J.p2),
    mk("M85",gr.B.p1,opp.m85),mk("M86",gr.J.p1,gr.H.p2),mk("M87",gr.K.p1,opp.m87),mk("M88",gr.D.p2,gr.G.p2),
  ];
  const W={};r32.forEach(m=>{W[m.id]=m.w;});
  const r16=[
    mk("M89",W.M73,W.M75),mk("M90",W.M74,W.M77),mk("M91",W.M76,W.M78),mk("M92",W.M79,W.M80),
    mk("M93",W.M81,W.M82),mk("M94",W.M83,W.M84),mk("M95",W.M86,W.M88),mk("M96",W.M85,W.M87),
  ];
  r16.forEach(m=>{W[m.id]=m.w;});
  const qf=[mk("M97",W.M89,W.M90),mk("M98",W.M91,W.M92),mk("M99",W.M93,W.M94),mk("M100",W.M95,W.M96)];
  qf.forEach(m=>{W[m.id]=m.w;});
  const sf=[mk("M101",W.M97,W.M98),mk("M102",W.M99,W.M100)];
  sf.forEach(m=>{W[m.id]=m.w;});
  const sf1l=sf[0].a===sf[0].w?sf[0].b:sf[0].a;
  const sf2l=sf[1].a===sf[1].w?sf[1].b:sf[1].a;
  const bronze=mk("M103",sf1l,sf2l);
  const final=mk("M104",W.M101,W.M102);
  return{gr,best8,r32,r16,qf,sf,bronze,final,CIRCLED:CIRCLED_IDS};
}

// ─── OLIVOS ENGINE ────────────────────────────────────────────
function runEngine(levelId,locked,ls,onProgress){
  return new Promise(resolve=>{
    const N=10000;
    const counts={};
    const allTeams=Object.values(GROUPS).flat();
    allTeams.forEach(t=>{counts[t]={winGroup:0,r32:0,r16:0,qf:0,sf:0,final:0,win:0};});
    let i=0;
    const BATCH=200;
    function runBatch(){
      const end=Math.min(i+BATCH,N);
      for(;i<end;i++){
        const s=runSim(levelId,locked,ls,null);
        Object.entries(s.gr).forEach(([g,d])=>{counts[d.p1].winGroup++;counts[d.p2].winGroup++;});
        s.r32.forEach(m=>{counts[m.w]&&counts[m.w].r32++;});
        s.r16.forEach(m=>{counts[m.w]&&counts[m.w].r16++;});
        s.qf.forEach(m=>{counts[m.w]&&counts[m.w].qf++;});
        s.sf.forEach(m=>{counts[m.w]&&counts[m.w].sf++;});
        counts[s.final.a]&&counts[s.final.a].final++;
        counts[s.final.b]&&counts[s.final.b].final++;
        counts[s.final.w]&&counts[s.final.w].win++;
      }
      onProgress(Math.round((i/N)*100));
      if(i<N){setTimeout(runBatch,0);}
      else{
        const results=allTeams.map(t=>({
          team:t,group:Object.entries(GROUPS).find(([,ts])=>ts.includes(t))?.[0]||'',
          winGroup:Math.round(counts[t].winGroup/N*100),
          r32:Math.round(counts[t].r32/N*100),r16:Math.round(counts[t].r16/N*100),
          qf:Math.round(counts[t].qf/N*100),sf:Math.round(counts[t].sf/N*100),
          final:Math.round(counts[t].final/N*100),win:Math.round(counts[t].win/N*100),
        }));
        resolve(results);
      }
    }
    setTimeout(runBatch,0);
  });
}

// ─── WHAT-IF TAB ──────────────────────────────────────────────
function WhatIfTab({sim,locked,onWhatifChange,whatif,C,t}){
  const[localWhatif,setLocalWhatif]=useState({...whatif});
  const[editing,setEditing]=useState(null);
  const[editA,setEditA]=useState(0);
  const[editB,setEditB]=useState(0);
  const allGroupMatches=[];
  Object.entries(sim.gr).forEach(([g,data])=>{data.matches.forEach(m=>{const k=`${m.a}|${m.b}`;allGroupMatches.push({...m,group:g,key:k,isLocked:m.locked,isWhatif:!!localWhatif[k]});});});
  const applyEdit=()=>{if(!editing)return;setLocalWhatif(prev=>({...prev,[editing.key]:{home:editA,away:editB}}));setEditing(null);};
  const resetAll=()=>{setLocalWhatif({});onWhatifChange({});};
  const applyAll=()=>onWhatifChange(localWhatif);
  return(
    <div>
      <div style={{background:`${C.blue}18`,border:`1px solid ${C.blue}`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
        <div style={{fontSize:12,fontWeight:"900",color:C.blue,letterSpacing:2,marginBottom:6}}>🔀 {t.whatifTitle}</div>
        <div style={{fontSize:11,color:C.text,lineHeight:1.7}}>{t.whatifDesc}</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={applyAll} style={{flex:1,padding:"10px",background:C.gold+"22",border:`2px solid ${C.gold}`,borderRadius:10,color:C.gold,fontSize:12,fontWeight:"700"}}>✅ {t.whatifApply}</button>
        <button onClick={resetAll} style={{flex:1,padding:"10px",background:"transparent",border:`1px solid ${C.border}`,borderRadius:10,color:C.muted,fontSize:12}}>🔄 {t.whatifReset}</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {allGroupMatches.map((m,i)=>{
          const wi=localWhatif[m.key];
          return(
            <div key={i} style={{background:m.isLocked?C.surface:wi?`${C.blue}11`:C.card,border:`1px solid ${m.isLocked?C.border:wi?C.blue:C.border}`,borderRadius:10,padding:"9px 10px",opacity:m.isLocked?0.7:1}}>
              <div style={{fontSize:8,color:C.muted,marginBottom:4,display:"flex",justifyContent:"space-between"}}>
                <span>Grupo {m.group}</span>
                {m.isLocked&&<span style={{fontSize:8,color:C.muted}}>{t.whatifLocked}</span>}
                {wi&&!m.isLocked&&<span style={{fontSize:8,color:C.blue}}>✏️ {wi.home}-{wi.away}</span>}
              </div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <span style={{fontSize:13}}>{fl(m.a)}</span>
                <span style={{fontSize:11,color:C.text,flex:1,textAlign:"center"}}>{m.a.split(" ")[0]}</span>
                <span style={{fontSize:12,color:C.muted}}>vs</span>
                <span style={{fontSize:11,color:C.text,flex:1,textAlign:"center"}}>{m.b.split(" ")[0]}</span>
                <span style={{fontSize:13}}>{fl(m.b)}</span>
              </div>
              {!m.isLocked&&(editing&&editing.key===m.key?(
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <input type="number" min="0" max="20" value={editA} onChange={e=>setEditA(+e.target.value)} style={{width:36,padding:"3px",textAlign:"center",borderRadius:5,border:`1px solid ${C.gold}`,background:C.surface,color:C.text,fontSize:12}}/>
                  <span style={{color:C.muted}}>-</span>
                  <input type="number" min="0" max="20" value={editB} onChange={e=>setEditB(+e.target.value)} style={{width:36,padding:"3px",textAlign:"center",borderRadius:5,border:`1px solid ${C.gold}`,background:C.surface,color:C.text,fontSize:12}}/>
                  <button onClick={applyEdit} style={{flex:1,padding:"3px 6px",background:C.gold,border:"none",borderRadius:5,color:"#000",fontSize:10,fontWeight:"700"}}>✓</button>
                  <button onClick={()=>setEditing(null)} style={{padding:"3px 6px",background:"transparent",border:`1px solid ${C.border}`,borderRadius:5,color:C.muted,fontSize:10}}>✗</button>
                </div>
              ):(
                <button onClick={()=>{setEditing(m);setEditA(wi?.home??1);setEditB(wi?.away??0);}} style={{width:"100%",padding:"4px",background:"transparent",border:`1px dashed ${C.border}`,borderRadius:6,color:C.muted,fontSize:9}}>
                  {wi?`${wi.home}-${wi.away} · Cambiar`:"+ Definir marcador"}
                </button>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AdminTab({C,t}){
  const[conflicts,setConflicts]=useState([]);
  const[matches,setMatches]=useState([]);
  const[editing,setEditing]=useState(null);
  const[editH,setEditH]=useState(0);
  const[editA,setEditA]=useState(0);
  const[msg,setMsg]=useState('');
  useEffect(()=>{
    supaFetch('conflict_log?resolved=eq.false&select=*').then(d=>setConflicts(d||[]));
    supaFetch('matches?competition=eq.WC2026&select=id,home_team,away_team,home_score,away_score,locked&order=match_date').then(d=>setMatches(d||[]));
  },[]);
  const doLock=async(id,lock)=>{await supaWrite(`matches?id=eq.${id}`,{locked:lock},'PATCH');setMatches(prev=>prev.map(m=>m.id===id?{...m,locked:lock}:m));setMsg(lock?`🔒 ${id} bloqueado`:`🔓 ${id} desbloqueado`);setTimeout(()=>setMsg(''),3000);};
  const doOverride=async()=>{if(!editing)return;await supaWrite(`matches?id=eq.${editing.id}`,{home_score:editH,away_score:editA,admin_override:true,locked:true},'PATCH');setMatches(prev=>prev.map(m=>m.id===editing.id?{...m,home_score:editH,away_score:editA,locked:true}:m));setEditing(null);setMsg(`✅ ${editing.id}: ${editH}-${editA}`);setTimeout(()=>setMsg(''),3000);};
  return(
    <div>
      <div style={{background:`${C.red}11`,border:`2px solid ${C.red}`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:"900",color:C.red,letterSpacing:2}}>🔐 {t.adminTitle}</div>
        <div style={{fontSize:9,color:C.muted,marginTop:2}}>Acceso restringido · Cambios en tiempo real</div>
      </div>
      {msg&&<div style={{background:C.green+"22",border:`1px solid ${C.green}`,borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:11,color:C.green}}>{msg}</div>}
      {conflicts.length>0&&(<div style={{marginBottom:14}}><div style={{fontSize:10,color:C.red,fontWeight:"700",letterSpacing:2,marginBottom:8}}>⚠️ {t.adminConflicts} ({conflicts.length})</div>{conflicts.map((c,i)=>(<div key={i} style={{background:C.card,border:`1px solid ${C.red}`,borderRadius:10,padding:"10px",marginBottom:6}}><div style={{fontSize:10,color:C.red,fontWeight:"700"}}>{c.match_id}</div><div style={{fontSize:9,color:C.muted,marginTop:3}}>FD: <strong style={{color:C.text}}>{c.primary_score}</strong> · AF: <strong style={{color:C.text}}>{c.secondary_score}</strong></div></div>))}</div>)}
      <div style={{fontSize:10,color:C.muted,letterSpacing:2,marginBottom:8}}>PARTIDOS ({matches.length})</div>
      {matches.map((m,i)=>(
        <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"9px 11px",marginBottom:6}}>
          {editing&&editing.id===m.id?(

              <div style={{fontSize:10,fontWeight:"700",color:C.text,marginBottom:8}}>{m.home_team} vs {m.away_team}</div>

                <input type="number" min="0" max="20" value={editH} onChange={e=>setEditH(+e.target.value)} style={{width:48,padding:"5px",textAlign:"center",borderRadius:6,border:`1px solid ${C.gold}`,background:C.surface,color:C.text,fontSize:14}}/>
                <span style={{color:C.muted,fontSize:14}}>-</span>
                <input type="number" min="0" max="20" value={editA} onChange={e=>setEditA(+e.target.value)} style={{width:48,padding:"5px",textAlign:"center",borderRadius:6,border:`1px solid ${C.gold}`,background:C.surface,color:C.text,fontSize:14}}/>
                <button onClick={doOverride} style={{flex:1,padding:"6px",background:C.gold,border:"none",borderRadius:6,color:"#000",fontSize:11,fontWeight:"700"}}>{t.adminSave}</button>
                <button onClick={()=>setEditing(null)} style={{padding:"6px 10px",background:"transparent",border:`1px solid ${C.border}`,borderRadius:6,color:C.muted,fontSize:11}}>{t.adminCancel}</button>
              </div>
            </div>
          ):(
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:10,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.home_team} vs {m.away_team}</div>
                <div style={{fontSize:9,color:C.muted}}>{m.id} · {m.home_score??"-"}-{m.away_score??"-"} · <span style={{color:m.locked?C.green:C.muted}}>{m.locked?"🔒":"⬜"}</span></div>
              </div>
              <div style={{display:"flex",gap:4,flexShrink:0}}>
                <button onClick={()=>doLock(m.id,!m.locked)} style={{padding:"3px 7px",background:"transparent",border:`1px solid ${m.locked?C.red:C.green}`,borderRadius:6,color:m.locked?C.red:C.green,fontSize:9}}>{m.locked?t.adminUnlock:t.adminLock}</button>
                <button onClick={()=>{setEditing(m);setEditH(m.home_score??0);setEditA(m.away_score??0);}} style={{padding:"3px 7px",background:"transparent",border:`1px solid ${C.blue}`,borderRadius:6,color:C.blue,fontSize:9}}>{t.adminOverride}</button>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── LIVE BADGE ───────────────────────────────────────────────
function LiveBadge({status,liveMatches,C,t}){
  const labels={live:t.liveData,cached:t.cached,error:t.offline,loading:t.loading};
  const colors={live:C.green,cached:C.muted,error:C.red,loading:C.blue};
  const hasLive=liveMatches&&liveMatches.length>0;
  return(
    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
      {hasLive&&(<div style={{display:"flex",alignItems:"center",gap:4,background:`${C.red}22`,border:`1px solid ${C.red}`,borderRadius:10,padding:"2px 8px"}}><div className="live-pulse" style={{width:7,height:7,borderRadius:"50%",background:C.liveDot}}/><span style={{fontSize:8,color:C.liveDot,fontWeight:"700",letterSpacing:1}}>{t.liveNow}</span></div>)}
      <div style={{fontSize:8,color:colors[status]||C.muted,border:`1px solid ${colors[status]||C.border}`,borderRadius:10,padding:"2px 8px",letterSpacing:1}}>
        {status==="live"?"🟢":status==="error"?"🔴":status==="loading"?"⏳":"⚪"} {labels[status]||status}
      </div>
    </div>
  );
}

  const[dark,setDark]=useState(true);

  const[sim,setSim]=useState(null);
  const[tab,setTab]=useState('groups');

  const[ls,setLs]=useState(null);
  const[locked,setLocked]=useState(null);
  const[liveStatus,setLiveStatus]=useState('loading');
  const[liveMatches,setLiveMatches]=useState([]);
  const[lastUpd,setLastUpd]=useState(null);
  const[whatif,setWhatif]=useState({});
  const[confettiFiredForChamp,setConfettiFiredForChamp]=useState(null);
  const isAdmin=checkAdmin();
  const C=dark?DARK:LIGHT;
  const t=T[lang];

  useEffect(()=>{
    async function load(){
      setLiveStatus('loading');
      try{
        const[teams,lockedM,live]=await Promise.all([
          supaFetch('teams?select=id,form_score'),
          supaFetch('matches?locked=eq.true&competition=eq.WC2026&select=home_team,away_team,home_score,away_score'),
          supaFetch('matches?status=eq.IN_PLAY&select=id,home_team,away_team,home_score,away_score'),
        ]);
        if(teams&&teams.length>0){const m={};teams.forEach(tm=>{m[tm.id]={form_score:tm.form_score||0};});setLs(m);}
        if(lockedM&&lockedM.length>0){const m={};lockedM.forEach(r=>{m[`${r.home_team}|${r.away_team}`]={home:r.home_score,away:r.away_score};});setLocked(m);}
        setLiveMatches(live||[]);
        setLiveStatus(teams&&teams.length>0?'live':'cached');
        setLastUpd(new Date().toLocaleTimeString());
      }catch{setLiveStatus('error');}
    }
    load();
    const iv=setInterval(load,5*60*1000);
    return()=>clearInterval(iv);
  },[]);

  useEffect(()=>{document.body.className=dark?"":"light";document.body.style.background=C.bg;},[dark]);
  useEffect(()=>{setSim(runSim(levelId,locked,ls,Object.keys(whatif).length>0?whatif:null));},[levelId,locked,ls,whatif]);

  // Fire confetti when Final tab opens
  useEffect(()=>{
    if(tab==='final'&&sim){

  },[tab,sim]);

    <div style={{background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,color:C.gold}}>

    </div>
  );

  const curLv=LEVELS.find(l=>l.id===levelId);
  const TABS=[...t.tabIds.map((id,i)=>({id,label:t.tabs[i]}))];

    {label:"Dieciseisavos · Los Ángeles",m:sim.r32.find(m=>m.id==="M84")},

    {label:"Octavos · Ciudad de México",m:sim.r16.find(m=>m.id==="M92")},
    {label:"Octavos · Atlanta",m:sim.r16.find(m=>m.id==="M95")},
    {label:"Cuartos · Boston",m:sim.qf.find(m=>m.id==="M97")},
    {label:"Semis · Atlanta",m:sim.sf.find(m=>m.id==="M102")},
    {label:"🏆 Gran Final · East Rutherford NJ",m:sim.final},

    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"Georgia,serif",paddingBottom:40}}>

      {/* HEADER IMAGE */}
      <div style={{background:"#000",borderBottom:`2px solid ${C.gold}`}}>
        <img src="./images/header-app.jpg" style={{width:"100%",maxHeight:120,objectFit:"cover",objectPosition:"center",display:"block"}} alt="Olivos Oracle"/>

            <LiveBadge status={liveStatus} liveMatches={liveMatches} C={C} t={t}/>

          </div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            {Object.keys(whatif).length>0&&<span style={{fontSize:9,background:`${C.blue}22`,color:C.blue,border:`1px solid ${C.blue}`,borderRadius:10,padding:"2px 8px"}}>🔀 What-If</span>}

        )}

        {tab==='engine'&&<EngineTab levelId={levelId} locked={locked} ls={ls} C={C} t={t}/>}
        {tab==='whatif'&&<WhatIfTab sim={sim} locked={locked} onWhatifChange={setWhatif} whatif={whatif} C={C} t={t}/>}
        {tab==='admin'&&isAdmin&&<AdminTab C={C} t={t}/>}

        {/* SHARE + COLLECT sections — always visible below tabs */}
        <ShareSection C={C} t={t} sim={sim}/>

      </div>

      {/* FOOTER */}
      <div style={{marginTop:20,padding:"12px 14px",borderTop:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
        <img src="./images/Olivos_Oracle_rojo.png" style={{width:18,height:18,objectFit:"contain",opacity:0.4}} alt=""/>
        <span style={{fontSize:9,color:C.border,letterSpacing:2}}>OLIVOS ORACLE · WC2026 · SOLO SIMULACIÓN</span>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
